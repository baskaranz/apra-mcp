[project]
name = "apra-mcp"
version = "0.1.0"
description = "Model Context Protocol (MCP) server for APRA regulations (CPS 230 & CPS 234)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "mcp<2",
    "pydantic>=2.14.1",
]

[project.scripts]
apra-mcp = "src.server:mcp.run"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
